name: Bug report
description: Etwas funktioniert nicht (Sync, Capture, Kino-Modus, Install)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Danke fürs Melden! Bitte so viele Infos wie möglich."
  - type: input
    id: distro
    attributes:
      label: Distribution / Desktop
      placeholder: "z. B. Zorin OS 18.1, GNOME 46, Wayland"
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Wie installiert?
      placeholder: ".deb / .rpm / AppImage / aus Quellcode"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Was passiert / erwartet?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Ausgabe von: cat ~/.cache/bloqsync/bloqsync.log"
      render: shell
