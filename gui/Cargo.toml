[package]
name = "bloqsync-gui"
version = "0.2.0"
edition = "2021"
description = "bloqsync desktop app (unofficial, AI-generated, public domain)"
license = "Unlicense"
repository = "https://github.com/niemanma/bloqsync"

[workspace]

[[bin]]
name = "bloqsync-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bloqsync = { path = ".." }
